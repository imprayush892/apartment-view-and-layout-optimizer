# Netlify: static site, no build step. The landing page is deploy/index.html, the app is deploy/app/.
[build]
  publish = "deploy"
  command = "python3 tools/build_site.py"

[[headers]]
  for = "/app/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
