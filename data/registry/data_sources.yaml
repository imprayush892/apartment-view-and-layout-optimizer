# Data-source registry. Every dataset or reference used by the pipeline must have an entry.
# `used_in_v0` = whether the current synthetic-only implementation actually consumes it.
# Statutory regulations are intentionally NOT registered: development limits are user inputs.
- id: DS-OSM
  name: OpenStreetMap (buildings, coastline, water, parks, roads)
  url: https://www.openstreetmap.org / https://download.geofabrik.de/asia/india.html
  accessed: 2026-09-26
  coverage: Global; Mumbai building coverage good in island city, heights sparse
  resolution: Vector; positional accuracy typically 1–5 m (volunteer-mapped)
  license: ODbL 1.0 — attribution + share-alike on derived databases
  reliability: medium (footprints) / low (heights, `building:levels` often missing)
  variables: [footprint, building:levels, height, natural=coastline, natural=water, leisure=park, highway]
  transformation: reproject EPSG:4326 -> local ENU; height = height or levels*3.0 m (flagged estimated)
  used_in_v0: false
- id: DS-OVERTURE-BLD
  name: Overture Maps Foundation — Buildings theme
  url: https://docs.overturemaps.org/guides/buildings/
  accessed: 2026-09-26
  coverage: Global (>2.3 bn buildings; includes Google Open Buildings for India)
  resolution: Vector footprints; optional height / num_floors
  license: ODbL (OSM-derived parts) / CDLA-Permissive-2.0 (others) — check per-feature `sources`
  reliability: medium
  variables: [footprint, height, num_floors, sources]
  transformation: same as DS-OSM; de-duplicate against OSM by IoU > 0.5
  used_in_v0: false
- id: DS-GOB
  name: Google Open Buildings (2.5D temporal where available)
  url: https://sites.research.google/open-buildings/
  accessed: 2026-09-26
  coverage: Africa, South/South-East Asia, Latin America (India included)
  resolution: Footprints from 50 cm imagery; confidence score per polygon
  license: CC BY 4.0 / ODbL (dual)
  reliability: medium; heights (2.5D product) are modelled estimates -> low
  variables: [footprint, confidence, building_height (2.5D)]
  transformation: filter confidence >= 0.75
  used_in_v0: false
- id: DS-COPDEM30
  name: Copernicus DEM GLO-30
  url: https://dataspace.copernicus.eu/explore-data/data-collections/copernicus-contributing-missions/collections-description/COP-DEM
  accessed: 2026-09-26
  coverage: Global (public release; some countries excluded)
  resolution: 1 arc-second (~30 m); DSM (includes buildings/vegetation)
  license: Free worldwide licence (Copernicus DEM licence; attribution required)
  reliability: medium for terrain; NOT suitable for individual building heights
  variables: [elevation_m]
  transformation: bilinear resample to model grid; used only for terrain
  used_in_v0: false
- id: DS-FABDEM
  name: FABDEM (Forest And Buildings removed Copernicus DEM)
  url: https://gee-community-catalog.org/projects/fabdem
  accessed: 2026-09-26
  coverage: Global
  resolution: ~30 m
  license: CC BY-NC-SA 4.0 (non-commercial) — do not use for commercial deliverables without licence
  reliability: medium (bare-earth estimate)
  variables: [terrain_elevation_m]
  transformation: preferred terrain source for research use
  used_in_v0: false
- id: DS-CTBUH
  name: CTBUH Skyscraper Center
  url: https://www.skyscrapercenter.com
  accessed: 2026-09-26
  coverage: Global tall buildings
  resolution: Per-building attributes (height, floors, structure, function)
  license: Proprietary — cite facts, do not bulk-copy
  reliability: high
  variables: [height, floors, structural_material, completion_year]
  transformation: manual transcription into precedent dataset with citation
  used_in_v0: true   # informs data/precedents/precedents.yaml
- id: DS-ARCH-PUBS
  name: Architect/engineer project pages (SOM, KPF, PCF-P, SHoP, Studio Gang, Herzog & de Meuron, Libeskind, RSHP)
  url: see per-precedent `sources` in data/precedents/precedents.yaml
  accessed: 2026-09-26
  coverage: Individual projects
  resolution: Text + published drawings
  license: Copyright — facts and parameter values only
  reliability: high for stated facts; drawings rarely dimensioned
  variables: [typology, rotation, core_type, units_per_floor, design_intent]
  transformation: manual parameter extraction; unknowns left null
  used_in_v0: true
- id: DS-WIKIPEDIA
  name: Wikipedia building articles
  url: https://en.wikipedia.org
  accessed: 2026-09-26
  coverage: Individual projects
  resolution: Text
  license: CC BY-SA 4.0
  reliability: medium — cross-check with DS-CTBUH
  variables: [height, floors, coordinates]
  transformation: manual
  used_in_v0: true
- id: DS-SYNTH
  name: Synthetic test sites generated by scripts/make_synthetic_site.py
  url: repository-local
  accessed: 2026-09-26
  coverage: Fictitious coastal plot (no real location)
  resolution: exact
  license: MIT (this repository)
  reliability: exact by construction
  variables: [boundary, envelope, context buildings, sea, park, landmarks]
  transformation: none
  used_in_v0: true
